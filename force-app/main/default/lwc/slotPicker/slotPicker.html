<template>
    <lightning-card title="Telemedicine Slot Picker" icon-name="custom:custom15">
        <div class="slds-p-around_medium">
            <lightning-input label="Practitioner ID" value={practitionerId} onchange={handleIdChange}></lightning-input>
            <lightning-button label="Search Slots" onclick={handleSearch} class="slds-m-top_small" variant="brand"></lightning-button>

            <template if:true={slots}>
                <div class="slds-m-top_medium">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th>Start Time</th>
                                <th>End Time</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={slots} for:item="slot">
                                <tr key={slot.Id}>
                                    <td><lightning-formatted-date-time value={slot.Start__c} hour="2-digit" minute="2-digit"></lightning-formatted-date-time></td>
                                    <td><lightning-formatted-date-time value={slot.End__c} hour="2-digit" minute="2-digit"></lightning-formatted-date-time></td>
                                    <td>
                                        <lightning-button label="Book" variant="neutral" icon-name="utility:event"></lightning-button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            
            <template if:true={error}>
                <p class="slds-text-color_error">{error}</p>
            </template>
        </div>
    </lightning-card>
</template>
